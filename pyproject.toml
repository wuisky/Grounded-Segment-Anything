[project]
name = "grounded-segment-anything"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "addict>=2.4.0",
    "diffusers[torch]>=0.35.1",
    "ipykernel>=6.30.1",
    "ipython>=9.6.0",
    "matplotlib>=3.10.6",
    "numpy==1.26.4",
    "onnx>=1.19.0",
    "onnxruntime>=1.23.1",
    "opencv-python==4.8.0.76",
    "pycocotools>=2.0.10",
    "segment-anything",
    "setuptools>=80.9.0",
    "supervision==0.21.0",
    "timm>=1.0.20",
    "torch==2.1.2",
    "torchvision==0.16.2",
    "transformers==4.36.2",
    "yapf>=0.43.0",
]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
grounded-segment-anything = { workspace = true }
segment-anything = { git = "https://github.com/SysCV/sam-hq.git" }

[dependency-groups]
dev = [
    "grounded-segment-anything",
]
